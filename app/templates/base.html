<!doctype html>
<html lang="en" data-theme="{{ year_themes.get(year, year_themes[current_year]) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ben's Big Board{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>try { var l = localStorage.getItem("look"); if (l && l !== "classic") document.documentElement.dataset.look = l; } catch (e) {}</script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{{ url_for('index') }}">Ben's Big Board</a>
      <nav class="main-nav" aria-label="Main">
        <a href="{{ url_for('about') }}" {% if active == 'about' %}aria-current="page"{% endif %}>About</a>
      </nav>
    </div>
    <nav class="year-nav" aria-label="Draft years">
      <div class="wrap year-row">
        {% for y in years %}
        <div class="year-menu{% if year == y %} active{% endif %}">
          <button type="button" class="year-btn" aria-expanded="false" aria-controls="year-menu-{{ y }}">
            {{ y }}
            <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="year-dropdown" id="year-menu-{{ y }}">
            {% for endpoint, label in sections %}
            {% if endpoint != 'watch_list' or y in watchlist_years %}
            <li><a href="{{ url_for(endpoint, year=y) }}" {% if year == y and section == endpoint %}aria-current="page"{% endif %}>{{ label }}</a></li>
            {% endif %}
            {% endfor %}
          </ul>
        </div>
        {% endfor %}
      </div>
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <div class="look-switch" role="group" aria-label="Preview look">
    <button type="button" data-set-look="classic">Current</button>
    <button type="button" data-set-look="paper">Newsprint</button>
    <button type="button" data-set-look="sheet">Scout sheet</button>
  </div>
  <script>
    (function () {
      var btns = document.querySelectorAll("[data-set-look]");
      function mark() {
        var cur = document.documentElement.dataset.look || "classic";
        btns.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.setLook === cur)); });
      }
      btns.forEach(function (b) {
        b.addEventListener("click", function () {
          var l = b.dataset.setLook;
          if (l === "classic") delete document.documentElement.dataset.look; else document.documentElement.dataset.look = l;
          try { localStorage.setItem("look", l); } catch (e) {}
          mark();
        });
      });
      mark();
    })();
  </script>
  <script>
    // Year dropdowns: click/tap to open (hover also opens on mouse devices, via CSS).
    (function () {
      var menus = document.querySelectorAll(".year-menu");
      function closeAll(except) {
        menus.forEach(function (m) {
          if (m !== except) {
            m.classList.remove("open");
            m.querySelector(".year-btn").setAttribute("aria-expanded", "false");
          }
        });
      }
      menus.forEach(function (menu) {
        var btn = menu.querySelector(".year-btn");
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var open = !menu.classList.contains("open");
          closeAll(menu);
          menu.classList.toggle("open", open);
          btn.setAttribute("aria-expanded", String(open));
          if (open) menu.querySelector(".year-dropdown a").focus();
        });
      });
      document.addEventListener("click", function () { closeAll(); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          var openMenu = document.querySelector(".year-menu.open");
          closeAll();
          if (openMenu) openMenu.querySelector(".year-btn").focus();
        }
      });
    })();
  </script>
</body>
</html>
